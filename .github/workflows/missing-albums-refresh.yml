name: Missing albums refresh

# Checks the collection's artists on Discogs and publishes the results to the
# missing-albums-data branch, which the site reads. Uses no Vercel resources.
# A first full check takes several hours, so an unfinished run starts the next one.
on:
  schedule:
    # Mondays and Thursdays, about 3 AM Pacific.
    - cron: '23 11 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: missing-albums-refresh
  cancel-in-progress: false

env:
  DATA_BRANCH: missing-albums-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch saved results
        run: |
          if git fetch --depth 1 origin "$DATA_BRANCH"; then
            git worktree add data FETCH_HEAD
          else
            mkdir data
          fi

      - name: Check artists and publish
        id: refresh
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          DISCOGS_USERNAME: ${{ vars.DISCOGS_USERNAME || 'bedouin_surf' }}
          DATA_DIR: data
          TIME_BUDGET_MINUTES: 20
        run: |
          fingerprint() {
            (cd data && find . -type f -not -path './.git*' -print0 | sort -z | xargs -0 -r sha256sum | sha256sum)
          }
          published=$(fingerprint)
          publish() {
            current=$(fingerprint)
            if [ "$current" = "$published" ]; then
              echo "No changes to publish"
              return
            fi
            published=$current
            tmp=$(mktemp -d)
            cp -R data/. "$tmp"
            rm -rf "$tmp/.git"
            # Vercel reads this from the pushed branch itself, so it must live here too.
            printf '{ "git": { "deploymentEnabled": false } }\n' > "$tmp/vercel.json"
            cd "$tmp"
            git init -q -b "$DATA_BRANCH"
            git add -A
            git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
              commit -q -m "Missing albums results"
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
              "HEAD:$DATA_BRANCH"
            cd - > /dev/null
            rm -rf "$tmp"
          }
          end=$((SECONDS + 300 * 60))
          while :; do
            npx --yes tsx@4 scripts/missing-albums-refresh.ts
            publish
            remaining=$(grep -o 'remaining=[0-9]*' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
            progressed=$(grep -o 'progressed=[a-z]*' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
            if [ "$remaining" = "0" ] || [ "$progressed" != "true" ] || [ $SECONDS -ge $end ]; then
              break
            fi
          done
          echo "continue=$([ "$remaining" != "0" ] && [ "$progressed" = "true" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Continue in a new run
        if: steps.refresh.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run missing-albums-refresh.yml --repo "$GITHUB_REPOSITORY"

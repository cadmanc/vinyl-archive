name: Missing albums refresh

# Saves everything the site shows (catalog with record details, missing albums and their
# pressings) to the missing-albums-data branch, and the wantlist to the owner-data branch,
# so browsers never wait on Discogs. Uses no Vercel resources.
# A first full pass takes days, so an unfinished run starts the next one.
on:
  schedule:
    # Daily, about 3 AM Pacific. Discographies are listed again about twice a week.
    - cron: '23 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: missing-albums-refresh
  cancel-in-progress: false

env:
  DATA_BRANCH: missing-albums-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch saved results
        run: |
          if git fetch --depth 1 origin "$DATA_BRANCH"; then
            git worktree add --detach data FETCH_HEAD
          else
            git worktree add --orphan data
          fi
          # Vercel reads this from the pushed branch itself, so it must live here too.
          printf '{ "git": { "deploymentEnabled": false } }\n' > data/vercel.json

      - name: Refresh and publish
        id: refresh
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          DISCOGS_USERNAME: ${{ vars.DISCOGS_USERNAME || 'bedouin_surf' }}
          GITHUB_TOKEN: ${{ github.token }}
          DATA_DIR: data
          TIME_BUDGET_MINUTES: 20
        run: |
          publish() {
            cd data
            git add -A
            if git diff --cached --quiet "origin/$DATA_BRANCH" -- 2>/dev/null; then
              echo "No changes to publish"
              cd - > /dev/null
              return
            fi
            # A single parentless commit keeps the branch from growing a history, while the
            # push still only uploads files that changed.
            tree=$(git write-tree)
            commit=$(git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
              commit-tree "$tree" -m "Saved site data")
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
              "$commit:refs/heads/$DATA_BRANCH"
            git fetch -q --depth 1 origin "+$DATA_BRANCH:refs/remotes/origin/$DATA_BRANCH"
            cd - > /dev/null
          }
          git -C data fetch -q --depth 1 origin "+$DATA_BRANCH:refs/remotes/origin/$DATA_BRANCH" || true
          end=$((SECONDS + 300 * 60))
          while :; do
            npx --yes tsx@4 scripts/missing-albums-refresh.ts
            publish
            remaining=$(grep -o 'remaining=[0-9]*' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
            progressed=$(grep -o 'progressed=[a-z]*' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
            if [ "$remaining" = "0" ] || [ "$progressed" != "true" ] || [ $SECONDS -ge $end ]; then
              break
            fi
          done
          echo "continue=$([ "$remaining" != "0" ] && [ "$progressed" = "true" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Continue in a new run
        if: steps.refresh.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run missing-albums-refresh.yml --repo "$GITHUB_REPOSITORY"

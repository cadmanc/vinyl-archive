name: Missing albums refresh

# Vercel stops a function from re-invoking itself after a few hops, so this keeps the
# server-side refresh going: it restarts the chain whenever it stops, until nothing is due.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: missing-albums-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - name: Keep the refresh running
        run: |
          url="https://records.psamera.com/api/missing-albums"
          end=$((SECONDS + 25 * 60))
          while [ $SECONDS -lt $end ]; do
            status=$(curl -sS --max-time 30 "$url?status=1" || true)
            echo "status: $status"
            if echo "$status" | grep -q '"running":false'; then
              result=$(curl -sS --max-time 30 "$url?refresh=1" || true)
              echo "refresh: $result"
              if echo "$result" | grep -q '"upToDate":true'; then exit 0; fi
            fi
            sleep 60
          done
